[project]
name = "sandbox"
version = "0.1.0"
description = "Ad Hoc scripts, etc."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.5.1",
    "commitizen>=4.16.5",
    "flake8>=7.3.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.1",
    "pylint>=4.0.6",
    "pytest>=8.4.2",
]

[tool.poe]
envfile = ".env"

[tool.pylint]
ignore-paths = [
    ".idea/",
]
disable = [
    "duplicate-code",
    "fixme",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-positional-arguments",
]
max-line-length = 120

# For Flake8 see: `.flake8`

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["apps"]

[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
message_template = "{{prefix}}({{ticket}}): {{message}}"
example = "feature(ABC-123): added new color"
schema = "<type>(<ticket>): <body>"
schema_pattern = '^\w+\([A-Za-z]+-\d+(?: [A-Za-z]+-\d+)*\):\s*\S.*$'
commit_parser = '^(?P<prefix>\w+)\((?P<ticket>[A-Za-z]+-\d+(?: [A-Za-z]+-\d+)*)\):\s*(?P<message>\S.*)$'

[[tool.commitizen.customize.questions]]
type = "list"
name = "prefix"
choices = [
    "fix",
    "feat",
    "docs",
    "style",
    "refactor",
    "perf",
    "test",
    "build",
    "ci",
]
message = "Select the type of change you are committing:"

[[tool.commitizen.customize.questions]]
type = "input"
name = "ticket"
message = "Space separated Jira ticket key list (ex. 'ABC-123 ABC-456') or if no applicable ticket use 'na-0':"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Write a short and imperative summary of the code changes:\n"

[tool.poe.tasks]
pre-commit-install = "pre-commit install --hook-type commit-msg --hook-type pre-push --hook-type pre-commit"
echo = "echo $GREETING"
commit = "cz commit"
test = "pytest"
sample = "python -m apps.sample.main"

[tool.poe.tasks.cqa]
sequence = [
    {cmd = "pytest"},
    {cmd = "pre-commit run --all-files"},
    {cmd = "echo 'Code Quality Passed!'" }
]
