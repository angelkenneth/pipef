[project]
name = "pipef"
version = "0.0.1"
description = "Function pipelines for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Angel Kenneth Tolentino", email = "angelkennethtolentino@gmail.com" },
]
requires-python = ">=3.8"
keywords = ["pipe", "pipeline", "compose", "functional"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/angelkenneth/pipef"
Repository = "https://github.com/angelkenneth/pipef"
Issues = "https://github.com/angelkenneth/pipef/issues"
Changelog = "https://github.com/angelkenneth/pipef/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipef"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE.md", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "commitizen>=4.16.5",
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "myst-parser>=4.0.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.1",
    "pylint>=4.0.6",
    "pytest>=8.4.2",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-rtd-theme>=3.0.2",
    "tox>=4.21",
]

# The library supports Python 3.8+, but the dev toolchain is resolved against the pinned interpreter only
[tool.uv.dependency-groups]
dev = { requires-python = ">=3.14" }

[tool.poe]
envfile = ".env"

[tool.pylint]
ignore-paths = [
    ".idea/",
    ".tox/",
    ".venv/",
    "docs/conf.py",
]
disable = [
    "duplicate-code",
    "fixme",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-positional-arguments",
]
max-line-length = 120
# Flags syntax and stdlib newer than the supported floor
py-version = "3.8"

# For Flake8 see: `.flake8`

[tool.mypy]
files = ["src"]
strict = true
# mypy 2.x can't target the 3.8 floor itself (see `[tool.pylint] py-version`) — 3.10 is its own oldest supported target
python_version = "3.10"

[tool.black]
line-length = 120
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Interpreters come from asdf shims — see `.tool-versions`; absent ones are skipped, not failed
[tool.tox]
requires = ["tox>=4.21"]
env_list = ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "type"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
description = "Run the test suite against {base_python}"
deps = ["pytest"]
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.tox.env.type]
description = "Type-check the package with mypy"
# mypy itself needs >=3.10 to run, so this rides the pinned dev interpreter rather than the 3.8 floor it checks against
base_python = ["3.14"]
deps = ["mypy"]
commands = [["mypy"]]

[tool.commitizen]
name = "cz_customize"
version_provider = "pep621"
version_files = ["src/pipef/__init__.py:__version__"]
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true

[tool.commitizen.customize]
message_template = "{{prefix}}({{ticket}}): {{message}}"
example = "feature(ABC-123): added new color"
schema = "<type>(<ticket>): <body>"
schema_pattern = '^\w+\([A-Za-z]+-\d+(?: [A-Za-z]+-\d+)*\):\s*\S.*$'
commit_parser = '^(?P<prefix>\w+)\((?P<ticket>[A-Za-z]+-\d+(?: [A-Za-z]+-\d+)*)\):\s*(?P<message>\S.*)$'
bump_pattern = '^(feat|fix|perf|refactor)'
bump_map = { feat = "MINOR", fix = "PATCH", perf = "PATCH", refactor = "PATCH" }
bump_map_major_version_zero = { feat = "MINOR", fix = "PATCH", perf = "PATCH", refactor = "PATCH" }
changelog_pattern = '^(feat|fix|perf|refactor)'
change_type_map = { feat = "Added", fix = "Fixed", perf = "Performance", refactor = "Changed" }

[[tool.commitizen.customize.questions]]
type = "list"
name = "prefix"
choices = [
    "fix",
    "feat",
    "docs",
    "style",
    "refactor",
    "perf",
    "test",
    "build",
    "ci",
]
message = "Select the type of change you are committing:"

[[tool.commitizen.customize.questions]]
type = "input"
name = "ticket"
message = "Space separated Jira ticket key list (ex. 'ABC-123 ABC-456') or if no applicable ticket use 'na-0':"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Write a short and imperative summary of the code changes:\n"

[tool.poe.tasks]
pre-commit-install = "pre-commit install --hook-type commit-msg --hook-type pre-push --hook-type pre-commit"
echo = "echo $GREETING"
commit = "cz commit"
test = "pytest"
test-all = "tox"
bump = "cz bump"

[tool.poe.tasks.clean]
shell = "rm -rf dist"

[tool.poe.tasks.build]
sequence = [
    {ref = "clean"},
    {cmd = "uv build"},
    {shell = "uvx twine check dist/*"},
]

# Uploads to PyPI with the token in `.env` (see `.env.example`)
[tool.poe.tasks.publish]
sequence = [
    {ref = "build"},
    {cmd = "uv publish"},
]

[tool.poe.tasks.cqa]
sequence = [
    {cmd = "pytest"},
    {cmd = "pre-commit run --all-files"},
    {cmd = "echo 'Code Quality Passed!'" }
]

# Builds the Sphinx site into docs/_build/html (gitignored); -W turns warnings into errors
[tool.poe.tasks.docs]
cmd = "sphinx-build -b html -W docs docs/_build/html"

# Serves the Sphinx site locally with live reload
[tool.poe.tasks.docs-serve]
cmd = "sphinx-autobuild docs docs/_build/html"
